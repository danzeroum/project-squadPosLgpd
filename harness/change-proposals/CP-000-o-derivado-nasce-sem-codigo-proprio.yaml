    rationale: >
      AS CINCO MUDANÇAS, UM SÓ MOVIMENTO (ADR-008 / passo 5 do /adotar). Separar qualquer
      uma deixaria o repositório vermelho no meio da transição:

      (1) REMOVER O EXEMPLO. `src/project/`, `tests/unit/` e os metadados do negócio de
      brinquedo — `CAP-PRICING`, `CAP-CATALOG`, `CMP-*`, `IFC-*`, `RULE-*`, `UI-*`, `REQ-*`,
      `MET-*`. O que o repositório governa é o alvo declarado em project.yaml:target, não
      precificação. Metadado de negócio que não existe é o pior ruído: valida, passa e mente.

      (2) SUPERSEDE O ADR-005. As asserções A1-A5 apontam para `src/project/*`; sem o código
      virariam `assertion_unresolvable` — uma trava que não encontra o que vigiar está
      quebrada, não satisfeita. O ADR fica como registro; o índice declara `superseded`.

      (3) AJUSTAR harness/stages.yaml. Os artefatos de STAGE-CODE e STAGE-TESTS passam a
      descrever o código do alvo materializado em `workspace/target/`, sem cravar caminho
      específico do alvo em `harness/` (ADR-008-A5 — nenhum alvo é especial).

      (4) REMOVER A ASSERÇÃO ADR-008-A6 DO ÍNDICE. Ela crava `kind: "mold"` em project.yaml
      e é trava do repositório de origem; herdada aqui ela reprovaria corretamente, porque
      este repositório é `derived`, declarado em project.yaml e ancorado em target.lock no
      mesmo movimento (passo 4 do /adotar).

      (5) CAMADA EXTERNA DESLIGADA E DATADA. A carcaça herda `external_audit.enabled: true`
      do molde, cujo atestado é emitido por `danzeroum/harness-authority` PARA O MOLDE —
      por-repositório, instransferível. Copiar o atestado simularia autoridade externa sobre
      este repositório; manter `enabled: true` sem atestado deixaria o CI permanentemente
      vermelho por condição que ninguém neste repositório satisfaz. Nasce `enabled: false`
      com `accepted_risk: RISK-EXT-001` reaberto e `due` — estado de primeira classe da
      política trava-externa ('o desligado continua declarável'). RELIGA quando a autoridade
      emitir atestado para ESTE repositório, e isso será mudança declarada com aval.

      E O QUE O NASCER LIMPA, SEM SER MUDANÇA À PARTE: o risk-register herdado cita
      controles que não chegaram ao derivado — RISK-INCUBA-001 apontava para
      `harness/change-proposals/CP-038-*.yaml` (proposta do molde, não copiada; o controle
      passa a apontar para o CP-000 deste repositório) e RISK-EXT-001 citava
      `harness/state/protection-attestation.json` (efêmero por-repositório; removido da
      lista de controles). O conformance-review herdado citava `CP-039` como consumidor de
      CONF-005 — proposta do molde que não existe aqui; a disposição vira `accepted` com
      rationale (o achado nasce com o CP-000 que remove o exemplo).

      POR QUE O RISCO É 'HIGH': remover código e metadado, para além das mudanças nos ADRs,
      tem efeito no caminho de publicação/release; e desligar a camada externa inta
